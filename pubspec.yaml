name: foryou_music
description: "A Free Music Player App using your Local Music Library. For You, By You and All Yours!. Developed by melodimistis known as xavier."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  loading_animation_widget: ^1.3.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  file_picker: ^13.3.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  provider: ^6.1.5+1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  uuid: ^4.6.0
  path: ^1.9.1
  audio_metadata_reader: ^1.8.1
  permission_handler: 12.0.3
  permission_handler_android: 13.0.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  dbus: ^0.8.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 200
