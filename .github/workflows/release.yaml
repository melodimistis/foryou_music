name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.4"
  CERT_SHA256: ba518202a6fc5c4a2d341a27a09b030d873f90ee0d3e4da4b2b2ef833c36eab9

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
              exit 1
            fi
            if [ ! -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
              echo "::error::Missing .github/release-notes/$GITHUB_REF_NAME.md"
              exit 1
            fi
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foryou-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/foryou-release.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Verify release signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee cert.txt
          if ! grep -q "certificate SHA-256 digest: $CERT_SHA256" cert.txt; then
            echo "::error::APK is not signed with the ForYou Music release key"
            exit 1
          fi

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "ForYou-Music-${{ needs.check.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ForYou-Music-*.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/foryou-release.jks"

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev imagemagick

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Show libmpv linking
        run: |
          ldd build/linux/x64/release/bundle/foryou_music build/linux/x64/release/bundle/lib/*.so | grep -i mpv || echo "libmpv is not linked directly"

      - name: Build AppImage
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/"
          convert assets/images/foryou_logo.png -resize 256x256 "$APPDIR/foryou-music.png"
          cat > "$APPDIR/foryou-music.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=ForYou Music
          Comment=A music player for the music you already own
          Exec=foryou_music
          Icon=foryou-music
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/foryou_music" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" "ForYou-Music-$VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ForYou-Music-*.AppImage
          if-no-files-found: error

  release:
    needs: [check, android, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: "true"
